<footer class="rfv2-footer" role="contentinfo">
  {% if module.copyright_text %}
  <p class="rfv2-footer__text">&copy; {{ module.copyright_text|escape_html }}</p>
  {% endif %}
  {% if module.privacy_label %}
  <a class="rfv2-footer__link" href="{{ module.privacy_url|default('#')|escape_attr }}">{{ module.privacy_label|escape_html }}</a>
  {% endif %}
</footer>
